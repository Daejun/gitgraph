[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gg-gitgraph"
version = "0.25.0"
description = "GitHub issue·PR·코멘트·@mention 관계를 ASCII 그래프로 보여주는 CLI + curses TUI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []   # runtime needs the `gh` CLI (and optionally the `claude` CLI); no Python packages

[project.scripts]
gg = "gitgraph:main"

[tool.setuptools]
py-modules = ["gitgraph"]
